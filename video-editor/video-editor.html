<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="video-editor.css"><link rel="stylesheet" href="fullscreen-layout.css"><title>Chỉnh sửa video — OpenScreen</title></head><body>
<header><div class="brand"><img src="../assets/logo.svg"><span>OpenScreen</span><em>VIDEO EDITOR</em></div><input id="name" value="Recording"><div><button id="library" class="btn">Thư viện</button><button id="export" class="btn btn-primary">Xuất video</button></div></header>
<main><section class="preview card"><div class="video-wrap"><video id="video" controls></video><div id="textOverlay"></div><div id="shapeOverlay"></div></div><div class="timeline"><span id="startLabel">0:00</span><div class="range-wrap"><input id="start" type="range" min="0" max="100" value="0" step="0.1"><input id="end" type="range" min="0" max="100" value="100" step="0.1"></div><span id="endLabel">0:00</span></div></section>
<aside class="card"><h1>Chỉnh sửa video</h1><p>Cắt đoạn và thêm lớp chú thích; xử lý ngay trên máy.</p><div class="group"><h2>Cắt thời lượng</h2><label>Bắt đầu <input id="startTime" type="number" min="0" step="0.1"></label><label>Kết thúc <input id="endTime" type="number" min="0" step="0.1"></label></div><div class="group"><h2>Lớp chữ</h2><label>Nội dung <input id="overlayText" type="text" placeholder="Nhập tiêu đề…"></label><label>Vị trí <select id="textPosition"><option value="top">Phía trên</option><option value="center">Chính giữa</option><option value="bottom">Phía dưới</option></select></label><label>Màu <input id="textColor" type="color" value="#ffffff"></label></div><div class="group"><h2>Khung nhấn mạnh</h2><label class="check"><input id="showBox" type="checkbox"> Hiển thị khung giữa màn hình</label><label>Màu khung <input id="boxColor" type="color" value="#ff406c"></label></div><div class="quality-note">Video xuất dùng codec tốt nhất Chrome hỗ trợ. Quá trình re-encode chạy theo thời gian thực và không tải dữ liệu lên mạng.</div></aside></main>
<div class="processing hidden" id="processing"><img src="../assets/logo.svg"><h2>Đang xuất video…</h2><p id="progressText">0%</p><button id="cancel" class="btn">Hủy</button></div>
<script src="../shared/db.js"></script><script src="../shared/utils.js"></script><script src="../shared/i18n.js"></script><script src="video-editor.js"></script></body></html>
